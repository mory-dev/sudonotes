[package]
name = "sudonotes"
version = "0.4.0"
description = "A lightweight, local-first notebook for prompts and ideas"
authors = ["sudonotes contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sudonotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
sudonotes-core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
notify = "8.2.0"
ulid = "3.0.0"
chrono = "0.4.45"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2"
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "^7", default-features = false, features = ["deflate"] }
# The GitHub token is the only credential this app holds, so it goes to the OS
# store rather than a file in the config directory. Native backends on Windows
# and macOS; the Secret Service over D-Bus on Linux, in its synchronous form so
# it can be called from a command without a runtime. `crypto-rust` is what
# encrypts the token in transit over the bus — without it the secret crosses in
# the clear — and it is the pure-Rust implementation, so no OpenSSL.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
# Already in the tree via reqwest; named directly so the device-flow poll can
# sleep without blocking the command thread.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3.27.0"
