name: release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS installers need a Developer ID certificate and notarization; the
    # APPLE_* secrets aren't configured yet, so the macOS runners are left out
    # of the matrix until they are.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            name: Linux
          - platform: windows-latest
            args: ""
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      - run: npm ci
        working-directory: app

      # Azure Trusted Signing for the Windows artifacts. src-tauri/sign-windows.cmd
      # is a no-op when the AZURE_* secrets are absent, so forks still build.
      - name: Install the Windows signing tool
        if: matrix.platform == 'windows-latest'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is optional so a fork, or this repo before the certificates
          # are bought, still produces working (if unsigned) installers.
          # Set these and the same build becomes a signed, notarized one.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: Azure Trusted Signing, read by src-tauri/sign-windows.cmd.
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Signs the updater artifacts so the in-app auto-update can verify
          # them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: sudonotes ${{ github.ref_name }}
          releaseBody: |
            See the [changelog](https://sudonotes.com/changelog).

            Installers below are **unsigned** unless the release notes say
            otherwise — Windows SmartScreen and macOS Gatekeeper will warn.
            Verify against `checksums.txt` before installing.
          # Publish immediately so GitHub's `releases/latest` endpoint and the
          # Tauri updater can see the release without a manual dashboard step.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish SHA-256 sums for the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || exit 0
          sha256sum * > checksums.txt
          gh release upload "$TAG" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

  # The downloads page is a static Cloudflare Worker. Rebuild it only after
  # the release assets exist, otherwise its build-time GitHub API lookup can
  # bake in the previous version (especially for Linux packages).
  deploy-site:
    name: publish downloads page
    needs: checksums
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "94659721edab2c56629832072970499f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The apt repository must be generated before the astro build: npm run
      # deploy copies site/public/** (including the apt tree) into dist/.
      - name: Build the apt repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          mkdir -p /tmp/debs
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir /tmp/debs
          bash scripts/make-apt-repo.sh /tmp/debs site/public/apt
      - run: npm ci
        working-directory: site
      - run: npm run deploy
        working-directory: site

  apt-smoke:
    name: apt repo smoke test
    needs: deploy-site
    runs-on: ubuntu-latest
    steps:
      - name: Install from the published repo in a clean container
        run: |
          docker run --rm -e TAG="${{ github.ref_name }}" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq curl ca-certificates gpg >/dev/null
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://sudonotes.com/apt/key.asc | gpg --dearmor -o /etc/apt/keyrings/sudonotes.gpg
            echo "deb [signed-by=/etc/apt/keyrings/sudonotes.gpg] https://sudonotes.com/apt stable main" > /etc/apt/sources.list.d/sudonotes.list
            apt-get update -qq
            apt-get install -y -qq sudonotes
            # \${Version} escapes for the container's bash, which otherwise
            # expands the variable to empty before dpkg-query sees the format.
            version=$(sudonotes --version 2>/dev/null || dpkg-query -W -f="\${Version}" sudonotes)
            echo "installed $version"
            [ "$version" = "${TAG#v}" ]
          '
