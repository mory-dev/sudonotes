name: sudonotes
base: core22
version: '0.4.0'
summary: Lightweight, local-first notebook for AI prompts, templates & linked ideas
description: |
  sudonotes is a lightweight, local-first notebook designed specifically for organizing
  AI prompts, reusable templates, and brainstormed ideas.

  Prompts often end up scattered across chat histories, scratch files, and abandoned docs.
  When you need them again, you rewrite them from scratch. sudonotes keeps your prompt
  engineering refined, links prompts to the ideas that motivated them, and lets you find
  them instantly.

  Features:
  - Local-first: plain Markdown files in a folder you choose. No account, no sync, no lock-in.
  - Prompt templates with {{placeholders}} for quick fill-and-copy.
  - Idea bubbles: split brainstorms into blocks and point each at its optimal AI model.
  - IDEAS.md mirroring: links ideas directly into your software repository.
  - Fast SQLite FTS5 full-text search (Ctrl+K) and bi-directional [[wiki-links]].
  - Lightweight: built with Tauri (~20MB memory footprint).
license: MIT
website: https://sudonotes.com
issues: https://github.com/mory-dev/sudonotes/issues
source-code: https://github.com/mory-dev/sudonotes
icon: app/src-tauri/icons/icon.png
grade: stable
confinement: strict
layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1
apps:
  sudonotes:
    command: usr/bin/sudonotes
    desktop: usr/share/applications/sudonotes.desktop
    extensions: [gnome]
    plugs:
      - network        # AI feature (api.sudonotes.com), model catalog, health check
      - home           # vault folders and IDEAS.md mirrors live under $HOME
      # The GitHub token goes to the Secret Service over D-Bus. This plug is not
      # auto-connected, so until `snap connect
      # sudonotes:password-manager-service` is run, GitHub sign-in reports that
      # no credential store is reachable and the rest of the app is unaffected.
      - password-manager-service
package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu
parts:
  build-app:
    plugin: dump
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libdbus-1-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - libdbus-1-3
    source: .
    override-build: |
      set -eu
      rustup default stable
      cd app
      npm ci
      npm run tauri build -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      cd ..
      dpkg -x app/src-tauri/target/release/bundle/deb/*.deb $SNAPCRAFT_PART_INSTALL/
      sed -i -e "s|Icon=sudonotes|Icon=/usr/share/icons/hicolor/32x32/apps/sudonotes.png|g" \
        $SNAPCRAFT_PART_INSTALL/usr/share/applications/sudonotes.desktop
