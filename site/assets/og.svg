  <text x="88" y="490" font-family="JetBrains Mono" font-size="21" fill="#7aa2f7">Free and MIT licensed &middot; Windows, macOS and Linux</text>

  <text x="88" y="566" font-family="JetBrains Mono" font-size="20" fill="#5f626c">sudonotes.com</text>
