<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#9ece6a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#16171a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b8d96"/>
      <stop offset="50%" stop-color="#e4e5e9"/>
      <stop offset="100%" stop-color="#8b8d96"/>
    </linearGradient>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 100 800;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#16171a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#2c2e34" stroke-width="2"/>

  <g font-family="JetBrains Mono" font-weight="600" letter-spacing="-1">
    <text x="88" y="210" font-size="26" fill="#7aa2f7" font-weight="400">$</text>
    <text x="132" y="210" font-size="26" fill="url(#word)">sudonotes</text>
    <rect x="282" y="186" width="17" height="25" fill="#7aa2f7"/>
  </g>

  <text x="88" y="316" font-family="JetBrains Mono" font-size="42" font-weight="600" fill="#e4e5e9" letter-spacing="-1">Organize your prompts and ideas.</text>

  <g font-family="JetBrains Mono" font-size="23" fill="#b6b9c2">
